# A generic, single database configuration.



[alembic]

# Path to migration scripts

script_location = alembic



# Template used to generate migration file names

file_template = %%(rev)s_%%(slug)s



# Max length of characters to apply to the "slug" field

truncate_slug_length = 40



# Set to 'true' to run the environment during the 'revision' command

revision_environment = false



# Set to 'true' to allow .pyc and .pyo files without

# a corresponding .py file to be considered as revisions

sourceless = false



# Search path for version locations

version_locations = alembic/versions



# The output encoding used when revisions are generated from the template

output_encoding = utf-8



sqlalchemy.url = sqlite:///./healthcare_fl.db



[post_write_hooks]



[loggers]

keys = root,sqlalchemy,alembic



[handlers]

keys = console



[formatters]

keys = generic



[logger_root]

level = WARN

handlers = console

qualname =



[logger_sqlalchemy]

level = WARN

handlers =

qualname = sqlalchemy.engine



[logger_alembic]

level = INFO

handlers =

qualname = alembic



[handler_console]

class = StreamHandler

args = (sys.stderr,)

level = NOTSET

formatter = generic



[formatter_generic]

format = %(levelname)-5.5s [%(name)s] %(message)s

datefmt = %H:%M:%S
