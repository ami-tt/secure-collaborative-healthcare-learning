<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Secure Collaborative Healthcare Learning System</title>



  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">



  <!-- Tailwind CSS CDN -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            sans: ['Inter', 'sans-serif'],

          },

          colors: {

            health: {

              50: '#f0fdfa',

              100: '#ccfbf1',

              600: '#0d9488',

              700: '#0f766e',

            }

          }

        }

      }

    }

  </script>



  <!-- React 18 & ReactDOM CDN -->

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>



  <!-- Babel Standalone for JSX -->

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>



  <!-- Lucide Icons -->

  <script src="https://unpkg.com/lucide@latest"></script>



  <style>

    body { font-family: 'Inter', sans-serif; }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }

    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }

    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  </style>

</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

  <div id="root"></div>



  <!-- Main React Application Script -->

  <script type="text/babel">

    const { useState, useEffect } = React;



    const API_BASE = '/api/v1';



    // Helper fetch wrapper with JWT

    const apiCall = async (endpoint, options = {}) => {

      const token = localStorage.getItem('fl_auth_token');

      const headers = {

        'Content-Type': 'application/json',

        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),

        ...options.headers,

      };

      const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });

      if (response.status === 401) {

        localStorage.removeItem('fl_auth_token');

        localStorage.removeItem('fl_user');

      }

      if (!response.ok) {

        const errorData = await response.json().catch(() => ({}));

        throw new Error(errorData.detail || `Request failed with status ${response.status}`);

      }

      return response.json();

    };



    function App() {

      const [user, setUser] = useState(null);

      const [view, setView] = useState('landing'); // landing, login, register, dashboard, monitor, security

      const [loading, setLoading] = useState(true);



      useEffect(() => {

        const storedUser = localStorage.getItem('fl_user');

        const token = localStorage.getItem('fl_auth_token');

        if (token && storedUser) {

          setUser(JSON.parse(storedUser));

          apiCall('/auth/me')

            .then(profile => {

              setUser(prev => ({ ...prev, ...profile }));

              localStorage.setItem('fl_user', JSON.stringify({ ...JSON.parse(storedUser), ...profile }));

            })

            .catch(() => {

              localStorage.removeItem('fl_auth_token');

              localStorage.removeItem('fl_user');

              setUser(null);

            })

            .finally(() => setLoading(false));

        } else {

          setLoading(false);

        }

      }, []);



      const handleLoginSuccess = (data) => {

        localStorage.setItem('fl_auth_token', data.access_token);

        localStorage.setItem('fl_user', JSON.stringify(data));

        setUser(data);

        setView('dashboard');

      };



      const handleLogout = () => {

        localStorage.removeItem('fl_auth_token');

        localStorage.removeItem('fl_user');

        setUser(null);

        setView('landing');

      };



      if (loading) {

        return (

          <div className="min-h-screen flex items-center justify-center bg-slate-50">

            <div className="flex flex-col items-center space-y-3">

              <div className="w-10 h-10 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>

              <p className="text-xs font-semibold text-slate-500">Connecting to SecureFL Health...</p>

            </div>

          </div>

        );

      }



      return (

        <div className="min-h-screen flex flex-col">

          {/* Navigation Bar */}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView(user ? 'dashboard' : 'landing')}>

                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-blue-700 flex items-center justify-center text-white shadow-md shadow-teal-700/20">

                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>

                </div>

                <div>

                  <div className="flex items-center space-x-2">

                    <span className="text-lg font-bold text-slate-900 tracking-tight">Secure<span className="text-teal-600">FL</span> Health</span>

                    <span className="hidden sm:inline-block text-[10px] font-semibold uppercase px-2 py-0.5 rounded bg-teal-50 text-teal-700 border border-teal-200">FedAvg Core</span>

                  </div>

                  <p className="text-[11px] text-slate-500 hidden sm:block">Privacy-Preserving Clinical AI Network</p>

                </div>

              </div>



              <div className="flex items-center space-x-3">

                {user ? (

                  <>

                    <div className="hidden md:flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-semibold">

                      <button

                        onClick={() => setView('dashboard')}

                        className={`px-3 py-1.5 rounded-lg transition ${view === 'dashboard' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}

                      >

                        Dashboard

                      </button>

                      <button

                        onClick={() => setView('monitor')}

                        className={`px-3 py-1.5 rounded-lg transition ${view === 'monitor' ? 'bg-white text-teal-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}

                      >

                        FL Monitor

                      </button>

                      <button

                        onClick={() => setView('security')}

                        className={`px-3 py-1.5 rounded-lg transition ${view === 'security' ? 'bg-white text-purple-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}

                      >

                        Security & Audits

                      </button>

                    </div>



                    <div className="flex items-center space-x-2 pl-2 border-l border-slate-200">

                      <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold border capitalize ${

                        user.role === 'admin' ? 'bg-purple-50 text-purple-700 border-purple-200' :

                        user.role === 'hospital_admin' ? 'bg-teal-50 text-teal-700 border-teal-200' :

                        'bg-blue-50 text-blue-700 border-blue-200'

                      }`}>

                        {user.role.replace('_', ' ')}

                      </span>

                      <span className="hidden sm:inline text-xs font-bold text-slate-800">{user.full_name}</span>

                      <button

                        onClick={handleLogout}

                        className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition"

                        title="Sign Out"

                      >

                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>

                      </button>

                    </div>

                  </>

                ) : (

                  <div className="flex items-center space-x-3 text-xs font-semibold">

                    <button

                      onClick={() => setView('landing')}

                      className={`px-3 py-2 rounded-lg transition ${view === 'landing' ? 'text-teal-700 font-bold' : 'text-slate-600 hover:text-slate-900'}`}

                    >

                      Overview

                    </button>

                    <button

                      onClick={() => setView('login')}

                      className="px-3.5 py-2 text-slate-700 hover:bg-slate-100 rounded-lg transition"

                    >

                      Sign In

                    </button>

                    <button

                      onClick={() => setView('register')}

                      className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl shadow-xs transition shadow-teal-600/20"

                    >

                      Get Started

                    </button>

                  </div>

                )}

              </div>

            </div>

          </header>



          {/* Dynamic Content Views */}

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            {view === 'landing' && <LandingView onGetStarted={() => setView('register')} onSignIn={() => setView('login')} />}

            {view === 'login' && <LoginView onLoginSuccess={handleLoginSuccess} onNavigateRegister={() => setView('register')} />}

            {view === 'register' && <RegisterView onRegisterSuccess={() => setView('login')} onNavigateLogin={() => setView('login')} />}

            {view === 'dashboard' && user && <RoleDashboard user={user} onOpenMonitor={() => setView('monitor')} />}

            {view === 'monitor' && <FLMonitorView />}

            {view === 'security' && <SecurityView />}

          </main>

        </div>

      );

    }



    // 1. Landing View

    function LandingView({ onGetStarted, onSignIn }) {

      return (

        <div className="space-y-16">

          <div className="text-center max-w-3xl mx-auto pt-6">

            <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-teal-50 border border-teal-200 text-teal-800 text-xs font-semibold uppercase tracking-wider mb-6">

              <span className="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>

              <span>Decentralized Healthcare AI &bull; HIPAA & GDPR Compliant</span>

            </div>

            <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-900 tracking-tight leading-tight">

              Train Clinical AI Models <br />

              <span className="bg-gradient-to-r from-teal-600 to-blue-700 bg-clip-text text-transparent">Without Moving Patient Data</span>

            </h1>

            <p className="mt-6 text-base sm:text-lg text-slate-600 leading-relaxed">

              A secure federated learning platform empowering hospitals and medical research centers to collaboratively train predictive neural networks using Flower (FedAvg) and Differential Privacy — guaranteeing absolute patient data sovereignty.

            </p>

            <div className="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">

              <button

                onClick={onGetStarted}

                className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold text-xs shadow-md shadow-teal-600/20 transition"

              >

                Launch Interactive Demo &rarr;

              </button>

              <button

                onClick={onSignIn}

                className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-white hover:bg-slate-50 text-slate-800 font-semibold text-xs border border-slate-300 transition"

              >

                Sign In to Dashboard

              </button>

            </div>

            <div className="mt-12 grid grid-cols-2 sm:grid-cols-4 gap-6 pt-8 border-t border-slate-200 text-left">

              <div><p className="text-2xl font-bold text-slate-900">0 KB</p><p className="text-xs text-slate-500 font-medium">Raw Patient Data Shared</p></div>

              <div><p className="text-2xl font-bold text-teal-600">FedAvg</p><p className="text-xs text-slate-500 font-medium">Weighted Model Aggregation</p></div>

              <div><p className="text-2xl font-bold text-blue-700">DP-SGD</p><p className="text-xs text-slate-500 font-medium">Calibrated (&epsilon;, &delta;) Noise</p></div>

              <div><p className="text-2xl font-bold text-purple-700">3 Roles</p><p className="text-xs text-slate-500 font-medium">Admin &bull; Hospital &bull; Researcher</p></div>

            </div>

          </div>



          {/* Architecture Steps */}

          <div>

            <div className="text-center max-w-xl mx-auto mb-10">

              <h2 className="text-xs font-bold uppercase tracking-wider text-teal-700">Architecture Pipeline</h2>

              <h3 className="text-2xl font-bold text-slate-900 mt-1">How Collaborative Healthcare Learning Works</h3>

            </div>

            <div className="grid grid-cols-1 md:grid-cols-4 gap-5">

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">

                <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded">Step 01</span>

                <h4 className="text-sm font-bold text-slate-900 mt-3 mb-1">Model Broadcast</h4>

                <p className="text-xs text-slate-600 leading-relaxed">Central Flower server broadcasts global PyTorch weights to hospital edge clients.</p>

              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">

                <span className="text-xs font-bold text-teal-700 bg-teal-50 px-2 py-1 rounded">Step 02</span>

                <h4 className="text-sm font-bold text-slate-900 mt-3 mb-1">Local Edge Training</h4>

                <p className="text-xs text-slate-600 leading-relaxed">Hospitals train models locally on private EHRs behind their secure firewalls.</p>

              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">

                <span className="text-xs font-bold text-purple-700 bg-purple-50 px-2 py-1 rounded">Step 03</span>

                <h4 className="text-sm font-bold text-slate-900 mt-3 mb-1">Differential Privacy</h4>

                <p className="text-xs text-slate-600 leading-relaxed">Local gradients are clipped ($L_2 \le C$) and masked with calibrated Gaussian noise.</p>

              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">

                <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded">Step 04</span>

                <h4 className="text-sm font-bold text-slate-900 mt-3 mb-1">Secure FedAvg</h4>

                <p className="text-xs text-slate-600 leading-relaxed">Aggregator computes weighted global model parameters without inspecting raw records.</p>

              </div>

            </div>

          </div>

        </div>

      );

    }



    // 2. Login View

    function LoginView({ onLoginSuccess, onNavigateRegister }) {

      const [email, setEmail] = useState('');

      const [password, setPassword] = useState('');

      const [error, setError] = useState(null);

      const [loading, setLoading] = useState(false);



      const handleSubmit = async (e) => {

        e.preventDefault();

        setError(null);

        setLoading(true);

        try {

          const res = await apiCall('/auth/login', {

            method: 'POST',

            body: JSON.stringify({ email, password }),

          });

          onLoginSuccess(res);

        } catch (err) {

          setError(err.message || 'Login failed. Please verify credentials.');

        } finally {

          setLoading(false);

        }

      };



      const fillDemo = (e_val, p_val) => {

        setEmail(e_val);

        setPassword(p_val);

        setError(null);

      };



      return (

        <div className="max-w-md mx-auto pt-8">

          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">

            <h2 className="text-xl font-bold text-slate-900 mb-1">Sign In to Platform</h2>

            <p className="text-xs text-slate-500 mb-6">Select demo role or enter your credentials</p>



            {error && (

              <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs">

                {error}

              </div>

            )}



            <form onSubmit={handleSubmit} className="space-y-4">

              <div>

                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Email</label>

                <input

                  type="email"

                  required

                  value={email}

                  onChange={(e) => setEmail(e.target.value)}

                  placeholder="doctor@hospital.org"

                  className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-teal-600"

                />

              </div>

              <div>

                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>

                <input

                  type="password"

                  required

                  value={password}

                  onChange={(e) => setPassword(e.target.value)}

                  placeholder="••••••••••••"

                  className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-teal-600"

                />

              </div>

              <button

                type="submit"

                disabled={loading}

                className="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-xs transition"

              >

                {loading ? 'Authenticating...' : 'Sign In'}

              </button>

            </form>



            <div className="mt-6 pt-5 border-t border-slate-100">

              <p className="text-[11px] font-semibold text-slate-400 uppercase text-center mb-2">Instant Demo Credentials</p>

              <div className="grid grid-cols-3 gap-2">

                <button

                  type="button"

                  onClick={() => fillDemo('admin@securefl.health', 'AdminSecurePassword123!')}

                  className="p-2 text-center rounded-lg border border-purple-200 bg-purple-50 hover:bg-purple-100 text-purple-700 text-[11px] font-medium"

                >

                  Admin

                </button>

                <button

                  type="button"

                  onClick={() => fillDemo('hospadmin@hospital-alpha.org', 'HospAdmin123!')}

                  className="p-2 text-center rounded-lg border border-teal-200 bg-teal-50 hover:bg-teal-100 text-teal-700 text-[11px] font-medium"

                >

                  Hospital

                </button>

                <button

                  type="button"

                  onClick={() => fillDemo('researcher@fl-research.org', 'Researcher123!')}

                  className="p-2 text-center rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-700 text-[11px] font-medium"

                >

                  Researcher

                </button>

              </div>

            </div>



            <div className="mt-5 text-center">

              <button onClick={onNavigateRegister} className="text-xs text-slate-600 hover:text-teal-700 font-medium">

                Need an account? <span className="font-bold underline">Register here</span>

              </button>

            </div>

          </div>

        </div>

      );

    }



    // 3. Register View

    function RegisterView({ onRegisterSuccess, onNavigateLogin }) {

      const [formData, setFormData] = useState({

        full_name: '',

        email: '',

        password: '',

        role: 'researcher',

      });

      const [error, setError] = useState(null);

      const [loading, setLoading] = useState(false);



      const handleSubmit = async (e) => {

        e.preventDefault();

        setError(null);

        setLoading(true);

        try {

          await apiCall('/auth/register', {

            method: 'POST',

            body: JSON.stringify(formData),

          });

          onRegisterSuccess();

        } catch (err) {

          setError(err.message || 'Registration failed.');

        } finally {

          setLoading(false);

        }

      };



      return (

        <div className="max-w-md mx-auto pt-8">

          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">

            <h2 className="text-xl font-bold text-slate-900 mb-1">Create Account</h2>

            <p className="text-xs text-slate-500 mb-6">Register to participate in federated clinical research</p>



            {error && (

              <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs">

                {error}

              </div>

            )}



            <form onSubmit={handleSubmit} className="space-y-4">

              <div>

                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Role</label>

                <div className="grid grid-cols-3 gap-2">

                  {['researcher', 'hospital_admin', 'admin'].map((r) => (

                    <button

                      key={r}

                      type="button"

                      onClick={() => setFormData({ ...formData, role: r })}

                      className={`py-2 text-center rounded-xl text-xs font-semibold border capitalize transition ${

                        formData.role === r ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 text-slate-600'

                      }`}

                    >

                      {r.replace('_', ' ')}

                    </button>

                  ))}

                </div>

              </div>



              <div>

                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Name</label>

                <input

                  type="text"

                  required

                  value={formData.full_name}

                  onChange={(e) => setFormData({ ...formData, full_name: e.target.value })}

                  placeholder="Dr. Sarah Chen"

                  className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-teal-600"

                />

              </div>



              <div>

                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Email</label>

                <input

                  type="email"

                  required

                  value={formData.email}

                  onChange={(e) => setFormData({ ...formData, email: e.target.value })}

                  placeholder="doctor@hospital.org"

                  className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-teal-600"

                />

              </div>



              <div>

                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Password (min 8 chars)</label>

                <input

                  type="password"

                  required

                  minLength={8}

                  value={formData.password}

                  onChange={(e) => setFormData({ ...formData, password: e.target.value })}

                  placeholder="••••••••••••"

                  className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-teal-600"

                />

              </div>



              <button

                type="submit"

                disabled={loading}

                className="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-xs transition"

              >

                {loading ? 'Creating...' : 'Register'}

              </button>

            </form>



            <div className="mt-5 text-center">

              <button onClick={onNavigateLogin} className="text-xs text-slate-600 hover:text-teal-700 font-medium">

                Already registered? <span className="font-bold underline">Sign in</span>

              </button>

            </div>

          </div>

        </div>

      );

    }



    // 4. Role Dashboard Multiplexer

    function RoleDashboard({ user, onOpenMonitor }) {

      if (user.role === 'admin') return <AdminView onOpenMonitor={onOpenMonitor} />;

      if (user.role === 'hospital_admin') return <HospitalView onOpenMonitor={onOpenMonitor} />;

      return <ResearcherView onOpenMonitor={onOpenMonitor} />;

    }



    // 4a. Admin View

    function AdminView({ onOpenMonitor }) {

      const [hospitals, setHospitals] = useState([]);

      const [users, setUsers] = useState([]);

      const [audits, setAudits] = useState([]);

      const [loading, setLoading] = useState(true);



      const refresh = () => {

        setLoading(true);

        Promise.all([

          apiCall('/institutions/').catch(() => []),

          apiCall('/users/').catch(() => []),

          apiCall('/audit/?limit=10').catch(() => []),

        ]).then(([h, u, a]) => {

          setHospitals(h);

          setUsers(u);

          setAudits(a);

        }).finally(() => setLoading(false));

      };



      useEffect(() => { refresh(); }, []);



      const toggleStatus = async (id, currentStatus) => {

        const next = currentStatus === 'active' ? 'suspended' : 'active';

        await apiCall(`/institutions/${id}/status?new_status=${next}`, { method: 'PATCH' });

        refresh();

      };



      return (

        <div className="space-y-6">

          <div className="bg-white p-6 rounded-2xl border border-slate-200 flex items-center justify-between">

            <div>

              <h1 className="text-xl font-bold text-slate-900">System Administrator Portal</h1>

              <p className="text-xs text-slate-500">Superadmin oversight, institution approval, and HIPAA compliance trail</p>

            </div>

            <button onClick={refresh} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">

            </button>

          </div>



          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

            <div className="bg-white p-5 rounded-xl border border-slate-200">

              <span className="text-xs text-slate-500 font-semibold uppercase">Registered Hospitals</span>

              <h3 className="text-2xl font-bold text-teal-700 mt-1">{hospitals.length}</h3>

            </div>

            <div className="bg-white p-5 rounded-xl border border-slate-200">

              <span className="text-xs text-slate-500 font-semibold uppercase">Platform Users</span>

              <h3 className="text-2xl font-bold text-blue-700 mt-1">{users.length}</h3>

            </div>

            <div className="bg-white p-5 rounded-xl border border-slate-200">

              <span className="text-xs text-slate-500 font-semibold uppercase">Audit Logged Events</span>

          </div>



          {/* Hospitals Table */}

          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">

            <div className="p-5 border-b border-slate-100">

              <h3 className="text-sm font-bold text-slate-900">Hospital Node Network</h3>

            <div className="overflow-x-auto">

              <table className="w-full text-left text-xs text-slate-600">

                <thead className="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">

                    <th className="px-6 py-3">Hospital Name</th>

                    <th className="px-6 py-3">Contact</th>

                    <th className="px-6 py-3">Status</th>

                    <th className="px-6 py-3 text-right">Action</th>

                  </tr>

                </thead>

                <tbody className="divide-y divide-slate-100">

                    <tr key={h.id}>

                      <td className="px-6 py-4 font-medium">{h.name}</td>

                      <td className="px-6 py-4">{h.contact_email}</td>

                          {h.status === 'active' ? 'Suspend' : 'Approve'}

    // 4b. Hospital View

    function HospitalView() {

      const [datasets, setDatasets] = useState([]);

      const [showModal, setShowModal] = useState(false);

      const [newDs, setNewDs] = useState({ name: '', sample_count: 500, modality: 'tabular_ehr' });



      const refresh = () => {

        apiCall('/datasets/').then(setDatasets).catch(() => []);

      };



      useEffect(() => { refresh(); }, []);



      const createDataset = async (e) => {

        e.preventDefault();

        await apiCall('/datasets/', {

          method: 'POST',

          body: JSON.stringify({

            name: newDs.name,

            sample_count: parseInt(newDs.sample_count, 10),

            modality: newDs.modality,

            feature_schema: { features: ['age', 'bmi', 'systolic_bp', 'glucose', 'cholesterol'], target: 'risk_outcome' }

          })

        });

        setShowModal(false);

        refresh();

      };



      const totalPatients = datasets.reduce((a, b) => a + (b.sample_count || 0), 0);



      return (

        <div className="space-y-6">

          <div className="bg-white p-6 rounded-2xl border border-slate-200 flex items-center justify-between">

            <div>

              <h1 className="text-xl font-bold text-slate-900">Hospital Edge Node Operations</h1>

              <p className="text-xs text-slate-500">Local patient records remain strictly within hospital boundary</p>

            </div>

            <button

              onClick={() => setShowModal(true)}

              className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-xs"

            >

              + Register Cohort Schema

            </button>

          </div>



          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

            <div className="bg-white p-5 rounded-xl border border-slate-200">

              <span className="text-xs text-slate-500 font-semibold uppercase">Total Local Patients</span>

              <h3 className="text-2xl font-bold text-teal-700 mt-1">{totalPatients.toLocaleString()}</h3>

            </div>

            <div className="bg-white p-5 rounded-xl border border-slate-200">

              <span className="text-xs text-slate-500 font-semibold uppercase">Edge Client Node</span>

              <h3 className="text-2xl font-bold text-emerald-700 mt-1">Online &bull; Port 8080</h3>

            </div>

            <div className="bg-white p-5 rounded-xl border border-slate-200">

              <span className="text-xs text-slate-500 font-semibold uppercase">Privacy Budget Spent</span>

              <h3 className="text-2xl font-bold text-purple-700 mt-1">&epsilon; = 0.45 / 2.0</h3>

            </div>

          </div>



          {/* Datasets Table */}

          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">

            <div className="p-5 border-b border-slate-100">

              <h3 className="text-sm font-bold text-slate-900">Registered Local EHR Cohorts</h3>

            </div>

            <table className="w-full text-left text-xs text-slate-600">

              <thead className="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">

                <tr>

                  <th className="px-6 py-3">Cohort Name</th>

                  <th className="px-6 py-3">Modality</th>

                  <th className="px-6 py-3">Patients</th>

                  <th className="px-6 py-3">Privacy Guard</th>

                </tr>

              </thead>

              <tbody className="divide-y divide-slate-100">

                {datasets.map(ds => (

                  <tr key={ds.id}>

                    <td className="px-6 py-4 font-bold text-slate-900">{ds.name}</td>

                    <td className="px-6 py-4 font-mono uppercase">{ds.modality}</td>

                    <td className="px-6 py-4 font-bold text-teal-700">{ds.sample_count.toLocaleString()}</td>

                    <td className="px-6 py-4 text-emerald-600 font-semibold">Zero Raw Transfer Verified</td>

                  </tr>

                ))}

              </tbody>

            </table>

          </div>



          {showModal && (

            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">

              <div className="bg-white p-6 rounded-2xl max-w-md w-full border border-slate-200">

                <h3 className="text-base font-bold text-slate-900 mb-4">Register Patient Cohort Schema</h3>

                <form onSubmit={createDataset} className="space-y-3">

                  <div>

                    <label className="block text-xs font-semibold text-slate-700 mb-1">Cohort Name</label>

                    <input

                      type="text"

                      required

                      value={newDs.name}

                      onChange={e => setNewDs({...newDs, name: e.target.value})}

                      placeholder="Cardiovascular Inpatient Cohort"

                      className="w-full px-3 py-2 border rounded-xl text-xs"

                    />

                  </div>

                  <div>

                    <label className="block text-xs font-semibold text-slate-700 mb-1">Patient Samples</label>

                    <input

                      type="number"

                      required

                      value={newDs.sample_count}

                      onChange={e => setNewDs({...newDs, sample_count: e.target.value})}

                      className="w-full px-3 py-2 border rounded-xl text-xs"

                    />

                  </div>

                  <div className="pt-3 flex justify-end space-x-2">

                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-xs font-semibold text-slate-600">Cancel</button>

                    <button type="submit" className="px-4 py-2 text-xs font-semibold bg-teal-600 text-white rounded-xl">Register</button>

                  </div>

                </form>

              </div>

            </div>

          )}

        </div>

      );

    }



    // 4c. Researcher View

      const [projects, setProjects] = useState([]);

      const [sessions, setSessions] = useState([]);



      useEffect(() => {

        apiCall('/fl/projects').then(setProjects).catch(() => []);

        apiCall('/fl/sessions').then(setSessions).catch(() => []);

      }, []);



      return (

        <div className="space-y-6">

          <div className="bg-white p-6 rounded-2xl border border-slate-200 flex items-center justify-between">

            <div>

              <h1 className="text-xl font-bold text-slate-900">Clinical Research Studio</h1>

              <p className="text-xs text-slate-500">Configure multi-center federated ML studies and launch convergence runs</p>

            </div>

            <button

              onClick={onOpenMonitor}

              className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-xs flex items-center gap-1.5"

            >

              Open FL Telemetry Room &rarr;

            </button>

          </div>



          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

            {projects.map(p => (

              <div key={p.id} className="bg-white p-5 rounded-2xl border border-slate-200">

                <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-mono">

                  {p.model_architecture}

                </span>

                <h3 className="text-base font-bold text-slate-900 mt-2">{p.title}</h3>

                <p className="text-xs text-slate-600 mt-1">{p.description}</p>

                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">

                  <span className="text-slate-500">Condition: <strong>{p.target_condition}</strong></span>

                  <span className="text-teal-700 font-semibold font-mono">Modality: {p.modality}</span>

          </div>



          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">

            <div className="p-5 border-b border-slate-100">

              <h3 className="text-sm font-bold text-slate-900">Configured Training Sessions</h3>

            </div>

            <table className="w-full text-left text-xs text-slate-600">

              <thead className="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">

                <tr>

                  <th className="px-6 py-3">Session Name</th>

                  <th className="px-6 py-3">Rounds</th>

                  <th className="px-6 py-3">Strategy</th>

                  <th className="px-6 py-3">DP Epsilon</th>

                  <th className="px-6 py-3">Status</th>

                </tr>

              </thead>

              <tbody className="divide-y divide-slate-100">

                {sessions.map(s => (

                  <tr key={s.id}>

                    <td className="px-6 py-4 font-bold text-slate-900">{s.session_name}</td>

                    <td className="px-6 py-4 font-mono">{s.current_round} / {s.total_rounds}</td>

                    <td className="px-6 py-4 font-mono">{s.aggregation_strategy}</td>

                    <td className="px-6 py-4 font-bold text-purple-700">&epsilon; = {s.dp_epsilon}</td>

                    <td className="px-6 py-4">

                      <span className="px-2 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200 text-[11px] font-semibold capitalize">

                        {s.status}

                      </span>

                    </td>

                  </tr>

                ))}

              </tbody>

            </table>

          </div>

        </div>

      );

    }

    // 6. Security & Audit View

    function SecurityView() {

      const [logs, setLogs] = useState([]);



      useEffect(() => {

        apiCall('/audit/?limit=50').then(setLogs).catch(() => []);

      }, []);



      return (

        <div className="space-y-6">

          <div className="bg-white p-6 rounded-2xl border border-slate-200">

            <h1 className="text-xl font-bold text-slate-900">Security & Regulatory Compliance Ledger</h1>

            <p className="text-xs text-slate-500">Immutable HIPAA audit trail capturing authentication, parameter updates, and institutional authorizations</p>

          </div>



          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">

            <table className="w-full text-left text-xs text-slate-600">

              <thead className="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">

                <tr>

                  <th className="px-6 py-3">Timestamp</th>

                  <th className="px-6 py-3">Action</th>

                  <th className="px-6 py-3">Resource</th>

                  <th className="px-6 py-3">IP Address</th>

                  <th className="px-6 py-3">Outcome</th>

                </tr>

              </thead>

              <tbody className="divide-y divide-slate-100">

                  <tr key={log.id}>

                    <td className="px-6 py-4 font-mono text-xs">{log.resource_type}</td>

                    <td className="px-6 py-4 font-mono text-slate-500">{log.ip_address || '127.0.0.1'}</td>

                    <td className="px-6 py-4">

                      <span className={`px-2 py-0.5 rounded text-[11px] font-semibold ${

                        {log.status}

                      </span>

                    </td>

                  </tr>

                ))}

              </tbody>

            </table>

          </div>

        </div>

      );

    }



    // Render the React application

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
