[alembic]

# Path to migration scripts

script_location = backend/alembic

# SQLite URL is default for development; can be overridden by env var

sqlalchemy.url = sqlite:///./healthcare_fl.db



[loggers]

keys = root,sqlalchemy,alembic



[handlers]

keys = console



[formatters]

keys = generic



[logger_root]

level = WARN

handlers = console

qualname =



[logger_sqlalchemy]

level = WARN

handlers =

qualname = sqlalchemy.engine



[logger_alembic]

level = INFO

handlers =

qualname = alembic



[handler_console]

class = StreamHandler

args = (sys.stderr,)

level = NOTSET

formatter = generic



[formatter_generic]

format = %(levelname)-5.5s [%(name)s] %(message)s
